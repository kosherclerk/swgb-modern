; SWGB Modern settings. The launcher edits this file; manual edits are kept.

[Display]
Renderer=auto            ; auto, d3d11, d3d12, d3d10, vulkan, opengl, software
Mode=borderless          ; borderless, windowed   (Alt+Enter toggles in game)
Monitor=                 ; monitor to run on, e.g. \.\DISPLAY2 (empty = primary; the launcher lists them)
GameWidth=0              ; in-game resolution (widescreen); 0 = original modes
GameHeight=0
ScaleMode=aspect         ; aspect, integer, stretch
Filter=nearest           ; nearest, sharp, bilinear
VSync=1
MaxFPS=0                 ; 0 = monitor refresh rate when VSync is on
LockCursor=1             ; keep the mouse inside the game while focused
WindowWidth=0            ; windowed mode size; 0 = automatic
WindowHeight=0
AllowTearing=1

[Widescreen]
PanelStyle=stretch       ; stretch (wide info panel, like Expanding Fronts) or center (original panel centred)

[Fixes]
Widescreen=1             ; use GameWidth x GameHeight in game (Clone Campaigns and base game)
GameFPS=60               ; battlefield redraw rate (original 20); game speed is unaffected
MinimapRefreshMs=100     ; original 333
SmoothScroll=1           ; camera moves a little every frame instead of half-tile jumps 20 times a second
ScrollSpeedPct=80        ; camera speed with SmoothScroll (100 = exact scroll-speed setting)
IdleCPU=1                ; stop the game from spinning a CPU core at 100%
IdleWaitMs=2             ; IdleCPU: longest wait between checks when the game has nothing to do (1-16)
IsolateVolume=1          ; in-game volume sliders no longer change the Windows volume

[Audio]
Enabled=1                ; 0 = use Windows DirectSound instead of the SWGB Modern engine
Resampler=sinc           ; sinc, cubic, linear
Volume=100               ; master volume in percent (0-200)
LatencyMs=20
Limiter=1

[Enhancements]
HDText=0                 ; smooth (anti-aliased) interface text, like Expanding Fronts
SmoothFog=0              ; fog of war: full detail, evenly darkened instead of a black checkerboard
FogBrightness=73         ; fogged areas: percent of normal brightness

[Zoom]
Enabled=0                ; mouse-wheel zoom of the battlefield (needs widescreen)
MaxOut=70                ; furthest zoom-out in percent (40-100); lower = more map, more CPU
MaxIn=125                ; furthest zoom-in in percent (100-200)
SnapAt100=1              ; zooming through 100% stops there first
StepPct=10               ; zoom change per wheel notch, percent

[Video]
PlayIntro=1              ; play the intro videos (any key skips one, Esc skips all)
Intros=xlogo1,xintro

[Debug]
Log=0
Diagnostics=0            ; detailed per-second log + capture key (saves video/stills/screenshot around the key press)
CaptureKey=ctrl+shift+f12 ; e.g. f12, ctrl+shift+f12, scrolllock (ctrl+f12 is the game's own Full Map Print)
CaptureSeconds=3         ; seconds kept before and after the key press (1-10)
CaptureFps=30            ; video frame rate of captures (5-60)
CrashDumps=1
DumpFrameSeconds=0
